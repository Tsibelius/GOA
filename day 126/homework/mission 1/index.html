<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo List</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    margin: 0;
  }
  .app {
    width: 100%;
    max-width: 500px;
  }
  h1 {
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 24px;
  }
  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }
  #todo-input {
    flex: 1;
    padding: 10px 14px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
  }
  #todo-input:focus {
    border-color: #f5a623;
  }
  #add-btn {
    background: #f5a623;
    border: none;
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    padding: 0 20px;
    border-radius: 6px;
    cursor: pointer;
  }
  #add-btn:hover {
    background: #e0951a;
  }
  #input-err {
    color: #e53e3e;
    font-size: 13px;
    margin: -16px 0 16px;
    display: none;
  }
  #todo-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .todo-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #e9e9e9;
    border-radius: 8px;
    padding: 14px 18px;
  }
  .todo-item span {
    font-size: 15px;
    color: #222;
  }
  .delete-btn {
    background: #e53e3e;
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .delete-btn:hover {
    background: #c53030;
  }
</style>
</head>
<body>
  <div class="app">
    <h1>Todo List</h1>
    <div class="input-row">
      <input id="todo-input" type="text" placeholder="დასახე გეგმა ..." />
      <button id="add-btn">Add Todo</button>
    </div>
    <div id="input-err">შეიყვანეთ გეგმა</div>
    <div id="todo-list"></div>
  </div>

<script  src="script.js"></script>
 
</script>
</body>
</html>
